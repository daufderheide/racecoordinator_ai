name: Release

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "DEVELOPMENT.md"
      - "ANALYTICS.md"
      - "docs/**"
      - "help_center/**"
      - ".agent/**"
  schedule:
    - cron: '15 6 * * *' # 2:15 AM EDT (6:15 AM UTC)
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 1.0.0-beta.1)'
        required: false
        default: ''
      skip_release:
        description: 'Skip publishing GitHub Release (just build artifacts)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      release_title: ${{ steps.check.outputs.release_title }}
      commit_sha: ${{ steps.check.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - name: Fetch all tags
        run: git fetch --tags --force
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Determine Version & Metadata
        id: check
        run: |
          node scripts/determine_release_version.js
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" == "schedule" ]; then
            git fetch --all --prune
            SYNC_STATUS=$(node -e "const s = require('./scripts/sync_release_branch').checkSyncStatus(); process.stdout.write(s.status);")
            ACTIVE_BRANCH=$(node -e "const s = require('./scripts/sync_release_branch').checkSyncStatus(); process.stdout.write(s.activeReleaseBranch || '');")
            echo "Schedule Sync Status: $SYNC_STATUS (Active: $ACTIVE_BRANCH)"

            if [ "$SYNC_STATUS" == "CONFLICT" ]; then
              echo "WARNING: Unmerged commits exist on $ACTIVE_BRANCH with merge conflict. Skipping daily build to prevent stale alpha release."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ "$SYNC_STATUS" == "PENDING_MERGE" ]; then
              echo "Merging $ACTIVE_BRANCH into develop before daily build..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git merge --no-ff "origin/$ACTIVE_BRANCH" -m "chore: merge $ACTIVE_BRANCH into develop before daily build [skip ci]"
              git push origin develop
            fi

            LATEST_TAG=$(git describe --tags --match "*-alpha*" --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              COMMITS=$(git rev-list --count "$LATEST_TAG..HEAD")
              if [ "$COMMITS" -eq 0 ]; then
                echo "No new commits on develop since $LATEST_TAG. Skipping daily build."
                echo "should_run=false" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

  run-tests:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check-changes.outputs.commit_sha }}

  build-artifacts:
    needs: [check-changes, run-tests]
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.commit_sha }}

      - name: Set Version in Files
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          echo "Configuring codebase version to $VERSION"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" client/package.json
          sed -i "s/#define MyAppVersion \".*\"/#define MyAppVersion \"$VERSION\"/" installer_base.iss
          sed -i "s/SERVER_VERSION = \".*\";/SERVER_VERSION = \"$VERSION\";/" server/src/main/java/com/antigravity/App.java
          sed -i "s/CLIENT_VERSION_OVERRIDE || \".*\";/CLIENT_VERSION_OVERRIDE || \"$VERSION\";/" client/src/app/analytics.service.ts
          sed -i "s/CLIENT_VERSION_OVERRIDE || \".*\";/CLIENT_VERSION_OVERRIDE || \"$VERSION\";/" client/src/app/components/raceday-setup/raceday-setup.component.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Analytics Properties
        run: |
          mkdir -p server/src/main/resources
          echo "ga.measurement.id=${{ secrets.GA_MEASUREMENT_ID }}" > server/src/main/resources/analytics.properties
          echo "ga.api.secret=${{ secrets.GA_API_SECRET }}" >> server/src/main/resources/analytics.properties

      - name: Cache Build Dependencies
        uses: actions/cache@v4
        with:
          path: build_cache
          key: ${{ runner.os }}-build-cache-${{ hashFiles('create_installers.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Build Artifacts
        run: ./create_installers.sh

      - name: Upload Release Directory
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/

  build-windows:
    needs: [check-changes, build-artifacts]
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.commit_sha }}
      
      - name: Set Version in Inno Setup
        run: |
          $VERSION = "${{ needs.check-changes.outputs.version }}"
          Write-Host "Configuring Inno Setup with Version: $VERSION"
          (Get-Content installer_base.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion ""$VERSION""" | Set-Content installer_base.iss

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Compile Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_online.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_offline.iss

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: Output/

  build-mac:
    needs: [check-changes, build-artifacts]
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.commit_sha }}
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Build DMG
        run: ./create_mac_dmg.sh

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/RaceCoordinator_Mac.dmg

  build-linux:
    needs: [check-changes, build-artifacts]
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-changes.outputs.commit_sha }}

      - name: Set Version in Files
        run: |
          VERSION="${{ needs.check-changes.outputs.version }}"
          echo "Configuring codebase version to $VERSION"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" client/package.json
          sed -i "s/SERVER_VERSION = \".*\";/SERVER_VERSION = \"$VERSION\";/" server/src/main/java/com/antigravity/App.java
          sed -i "s/CLIENT_VERSION_OVERRIDE || \".*\";/CLIENT_VERSION_OVERRIDE || \"$VERSION\";/" client/src/app/analytics.service.ts
          sed -i "s/CLIENT_VERSION_OVERRIDE || \".*\";/CLIENT_VERSION_OVERRIDE || \"$VERSION\";/" client/src/app/components/raceday-setup/raceday-setup.component.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Analytics Properties
        run: |
          mkdir -p server/src/main/resources
          echo "ga.measurement.id=${{ secrets.GA_MEASUREMENT_ID }}" > server/src/main/resources/analytics.properties
          echo "ga.api.secret=${{ secrets.GA_API_SECRET }}" >> server/src/main/resources/analytics.properties

      - name: Build Linux ARM64 Release Package
        run: |
          chmod +x create_linux_arm64_release.sh
          ./create_linux_arm64_release.sh

      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: release/RaceCoordinatorAI-Linux-ARM64.tar.gz

  publish-release:
    needs: [check-changes, run-tests, build-windows, build-mac, build-linux, build-artifacts]
    if: ${{ needs.check-changes.outputs.should_run == 'true' && github.event.inputs.skip_release != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.check-changes.outputs.commit_sha }}

      - name: Download Windows Installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: final-release/
          
      - name: Download Mac DMG
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: final-release/

      - name: Download Linux Package
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: final-release/

      - name: Download Client Coverage Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-coverage-report
          path: final-release/coverage/client/

      - name: Download Server Coverage Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-coverage-report
          path: final-release/coverage/server/

      - name: Set Release Variables
        run: |
          TAG="${{ needs.check-changes.outputs.tag }}"
          IS_PRERELEASE="${{ needs.check-changes.outputs.is_prerelease }}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV

      - name: Rename Files with Version
        run: |
          mv final-release/RaceCoordinatorAI_Online_Setup.exe "final-release/RaceCoordinatorAI_Online_Setup_${TAG}.exe" || true
          mv final-release/RaceCoordinatorAI_Offline_Setup.exe "final-release/RaceCoordinatorAI_Offline_Setup_${TAG}.exe" || true
          mv final-release/RaceCoordinator_Mac.dmg "final-release/RaceCoordinator_Mac_${TAG}.dmg" || true
          mv final-release/RaceCoordinatorAI-Linux-ARM64.tar.gz "final-release/RaceCoordinatorAI-Linux-ARM64_${TAG}.tar.gz" || true
          if [ -d "final-release/coverage" ]; then
            node scripts/generate_coverage_portal.js final-release/coverage final-release/coverage/client final-release/coverage/server || true
            (cd final-release && zip -r "RaceCoordinatorAI_Coverage_Reports_${TAG}.zip" coverage && rm -rf coverage) || true
          fi

      - name: Generate Release Body
        run: |
          TAG="${{ needs.check-changes.outputs.tag }}"
          TITLE="${{ needs.check-changes.outputs.release_title }}"
          IS_PRERELEASE="${{ needs.check-changes.outputs.is_prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            if [[ "$TAG" == *"beta"* ]]; then
              STATUS_BADGE="> 🟡 **Beta Prerelease** — Preview of upcoming features for testing and feedback."
            else
              STATUS_BADGE="> 🔵 **Nightly / Alpha Build** — Automated snapshot build from active development."
            fi
          else
            STATUS_BADGE="> 🟢 **Official Stable Release** — Recommended for all general and race-day users."
          fi

          cat << EOF > release_body.md
          ## 🏎️ ${TITLE}

          ${STATUS_BADGE}

          ---

          ### 💻 Recommended Downloads

          | Operating System | Installer File | Notes |
          | :--- | :--- | :--- |
          | **🪟 Windows (10 / 11)** | \`RaceCoordinatorAI_Online_Setup_${TAG}.exe\` | **Recommended** — Fast online setup that automatically downloads required components. |
          | **🪟 Windows (8, 7, XP / Offline)** | \`RaceCoordinatorAI_Offline_Setup_${TAG}.exe\` | **Standalone** — Full installer with bundled runtime. *Required for first-time installation on Win 8 and older.* |
          | **🍏 macOS** | \`RaceCoordinator_Mac_${TAG}.dmg\` | Disk Image for macOS (Intel & Apple Silicon). Drag to \`Applications\`. |
          | **🐧 Linux / Raspberry Pi / Arduino Uno Q (ARM64)** | \`RaceCoordinatorAI-Linux-ARM64_${TAG}.tar.gz\` | Compressed archive for ARM64 Linux / Raspberry Pi OS / Arduino Uno Q. |

          > **💡 Tip for Non-Technical Users**: You do **not** need to download the source code zip or test coverage files to run Race Coordinator AI.

          ---

          <details>
          <summary>🔍 <b>Developer & QA Reports (Click to expand)</b></summary>

          - **Automated Test Coverage**: \`RaceCoordinatorAI_Coverage_Reports_${TAG}.zip\` *(Unzip and open \`index.html\` to view the unified Client & Server coverage dashboard)*
          </details>
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: ${{ needs.check-changes.outputs.release_title }}
          target_commitish: ${{ needs.check-changes.outputs.commit_sha }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body_path: release_body.md
          files: |
            final-release/*

      - name: Cleanup Release Artifacts
        run: |
          rm -rf final-release release_body.md

      - name: Update README on Main
        run: |
          git fetch origin main
          git checkout origin/main -- README.md
          node scripts/update_readme_downloads.js "${{ env.TAG }}" "${{ env.IS_PRERELEASE }}"

      - name: Create Pull Request for README
        uses: peter-evans/create-pull-request@v6
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            README.md
          commit-message: "docs: update latest download links to ${{ env.TAG }}"
          title: "docs: update latest download links to ${{ env.TAG }}"
          body: "Automated PR to update the README with the latest download links for release ${{ env.TAG }}."
          branch: "docs/update-readme-${{ env.TAG }}"
          base: "main"

  sync-to-develop:
    needs: [check-changes, publish-release]
    if: ${{ needs.check-changes.outputs.should_run == 'true' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync release branch into develop
        id: sync
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Merging origin/$BRANCH_NAME into develop..."
          if git merge --no-ff "origin/$BRANCH_NAME" -m "chore: merge $BRANCH_NAME into develop [skip ci]"; then
            git push origin develop
            echo "sync_status=merged" >> $GITHUB_OUTPUT
          else
            echo "Merge conflict detected when syncing $BRANCH_NAME into develop."
            echo "sync_status=conflict" >> $GITHUB_OUTPUT
            git merge --abort || true
          fi

      - name: Create PR for Conflict Resolution
        if: ${{ steps.sync.outputs.sync_status == 'conflict' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "sync/${{ github.ref_name }}-to-develop"
          base: "develop"
          title: "🚨 Sync Conflict: ${{ github.ref_name }} -> develop"
          body: |
            Automated sync from \`${{ github.ref_name }}\` into \`develop\` encountered merge conflicts.
            Please resolve conflicts and merge into \`develop\` to ensure it includes the latest beta fixes.


