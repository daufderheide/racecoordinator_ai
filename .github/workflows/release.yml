name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: '0 6 * * *' # 2 AM EDT (6 AM UTC)
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0-beta.1)'
        required: false
        default: ''
      skip_release:
        description: 'Skip publishing GitHub Release (just build artifacts)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              COMMITS=$(git rev-list --count "$LATEST_TAG..HEAD")
              if [ "$COMMITS" -eq 0 ]; then
                echo "No new commits since $LATEST_TAG. Skipping daily build."
                echo "should_run=false" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT

  run-tests:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    uses: ./.github/workflows/ci.yml

  build-artifacts:
    needs: [check-changes, run-tests]
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            VERSION="0.0.0-alpha.$(date +%Y%m%d)"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-alpha.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set Version in Files
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" client/package.json
          sed -i "s/#define MyAppVersion \".*\"/#define MyAppVersion \"$VERSION\"/" installer_base.iss
          sed -i "s/SERVER_VERSION = \".*\";/SERVER_VERSION = \"$VERSION\";/" server/src/main/java/com/antigravity/App.java
          sed -i "s/CLIENT_VERSION_OVERRIDE || \".*\";/CLIENT_VERSION_OVERRIDE || \"$VERSION\";/" client/src/app/analytics.service.ts
          sed -i "s/CLIENT_VERSION_OVERRIDE || \".*\";/CLIENT_VERSION_OVERRIDE || \"$VERSION\";/" client/src/app/components/raceday-setup/raceday-setup.component.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Analytics Properties
        run: |
          mkdir -p server/src/main/resources
          echo "ga.measurement.id=${{ secrets.GA_MEASUREMENT_ID }}" > server/src/main/resources/analytics.properties
          echo "ga.api.secret=${{ secrets.GA_API_SECRET }}" >> server/src/main/resources/analytics.properties

      - name: Cache Build Dependencies
        uses: actions/cache@v4
        with:
          path: build_cache
          key: ${{ runner.os }}-build-cache-${{ hashFiles('create_installers.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Build Artifacts
        run: ./create_installers.sh

      - name: Upload Release Directory
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/

  build-windows:
    needs: [check-changes, build-artifacts]
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Determine Version
        id: vars
        run: |
          if ("${{ github.event_name }}" -eq "schedule") {
            $VERSION = "0.0.0-alpha.$(Get-Date -Format 'yyyyMMdd')"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}" -ne "") {
            $VERSION = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $VERSION = "${{ github.ref_name }}".Substring(1)
          } else {
            $VERSION = "0.0.0-alpha.dev"
          }
          (Get-Content installer_base.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion ""$VERSION""" | Set-Content installer_base.iss

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Compile Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_online.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_offline.iss

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: Output/

  build-mac:
    needs: [check-changes, build-artifacts]
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Build DMG
        run: ./create_mac_dmg.sh

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/RaceCoordinator_Mac.dmg

  build-linux:
    needs: [check-changes, build-artifacts]
    if: ${{ needs.check-changes.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            VERSION="0.0.0-alpha.$(date +%Y%m%d)"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-alpha.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set Version in Files
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" client/package.json
          sed -i "s/SERVER_VERSION = \".*\";/SERVER_VERSION = \"$VERSION\";/" server/src/main/java/com/antigravity/App.java
          sed -i "s/CLIENT_VERSION_OVERRIDE || \".*\";/CLIENT_VERSION_OVERRIDE || \"$VERSION\";/" client/src/app/analytics.service.ts
          sed -i "s/CLIENT_VERSION_OVERRIDE || \".*\";/CLIENT_VERSION_OVERRIDE || \"$VERSION\";/" client/src/app/components/raceday-setup/raceday-setup.component.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Create Analytics Properties
        run: |
          mkdir -p server/src/main/resources
          echo "ga.measurement.id=${{ secrets.GA_MEASUREMENT_ID }}" > server/src/main/resources/analytics.properties
          echo "ga.api.secret=${{ secrets.GA_API_SECRET }}" >> server/src/main/resources/analytics.properties

      - name: Build Linux ARM64 Release Package
        run: |
          chmod +x create_linux_arm64_release.sh
          ./create_linux_arm64_release.sh

      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: release/RaceCoordinatorAI-Linux-ARM64.tar.gz

  publish-release:
    needs: [check-changes, run-tests, build-windows, build-mac, build-linux, build-artifacts]
    if: ${{ needs.check-changes.outputs.should_run == 'true' && github.event.inputs.skip_release != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: final-release/
          
      - name: Download Mac DMG
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: final-release/

      - name: Download Linux Package
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: final-release/

      - name: Download Client Coverage Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-coverage-report
          path: final-release/coverage/client/

      - name: Download Server Coverage Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-coverage-report
          path: final-release/coverage/server/

      - name: Determine Tags and Prerelease
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            TAG="v0.0.0-alpha.$(date +%Y%m%d)"
            IS_PRERELEASE="true"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.version }}" != "" ]; then
            TAG="v${{ github.event.inputs.version }}"
            if [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"beta"* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"beta"* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          else
            TAG="v0.0.0-alpha.${GITHUB_SHA::7}"
            IS_PRERELEASE="true"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV

      - name: Rename Files with Version
        run: |
          mv final-release/RaceCoordinatorAI_Online_Setup.exe "final-release/RaceCoordinatorAI_Online_Setup_${TAG}.exe" || true
          mv final-release/RaceCoordinatorAI_Offline_Setup.exe "final-release/RaceCoordinatorAI_Offline_Setup_${TAG}.exe" || true
          mv final-release/RaceCoordinator_Mac.dmg "final-release/RaceCoordinator_Mac_${TAG}.dmg" || true
          mv final-release/RaceCoordinatorAI-Linux-ARM64.tar.gz "final-release/RaceCoordinatorAI-Linux-ARM64_${TAG}.tar.gz" || true
          if [ -d "final-release/coverage" ]; then
            node scripts/generate_coverage_portal.js final-release/coverage final-release/coverage/client final-release/coverage/server || true
            (cd final-release && zip -r "RaceCoordinatorAI_Coverage_Reports_${TAG}.zip" coverage && rm -rf coverage) || true
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body: |
            ### 🏎️ Race Coordinator AI Release ${{ env.TAG }}

            #### 📦 Release Assets & Downloads
            - **Windows**: `RaceCoordinatorAI_Online_Setup_${{ env.TAG }}.exe` / `RaceCoordinatorAI_Offline_Setup_${{ env.TAG }}.exe`
            - **macOS**: `RaceCoordinator_Mac_${{ env.TAG }}.dmg`
            - **Linux (ARM64)**: `RaceCoordinatorAI-Linux-ARM64_${{ env.TAG }}.tar.gz`
            - **Test Coverage**: `RaceCoordinatorAI_Coverage_Reports_${{ env.TAG }}.zip` *(Unzip and open `index.html` to view the unified Client & Server coverage dashboard)*
          files: |
            final-release/*
