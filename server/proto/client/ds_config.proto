syntax = "proto3";
package com.antigravity;

option java_package = "com.antigravity.proto";
option java_multiple_files = true;
option java_outer_classname = "DsConfigProto";

enum DsType {
  DS_030 = 0;
  DS_200 = 1;
  DS_200B = 2;
  DS_300 = 3;
  DS_300RC = 4;
}

message DsConfig {
  string name = 1;
  string comm_port = 2;
  DsType type = 3;
  int32 baud_rate = 4;
}
