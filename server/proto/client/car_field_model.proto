syntax = "proto3";
package com.antigravity;

import "client/model.proto";

option java_package = "com.antigravity.proto";
option java_multiple_files = true;
option java_outer_classname = "CarFieldModelProto";

// A field the user adds to every slotcar (step 2 of car support). Each car
// keeps its own value for it in CarModel.custom_values, keyed by field id.
message CarFieldModel {
  Model model = 1;
  string name = 2;
  // "text", "number", "boolean" or "choice"
  string type = 3;
  // The choices of a "choice" field, in order
  repeated string options = 4;
  // Order in the editor, lowest first
  int32 position = 5;
}
