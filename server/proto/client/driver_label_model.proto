syntax = "proto3";
package com.antigravity;

import "client/model.proto";

option java_package = "com.antigravity.proto";
option java_multiple_files = true;
option java_outer_classname = "DriverLabelModelProto";

message DriverLabelModel {
  Model model = 1;
  string name = 2;
  string color = 3;
}
