syntax = "proto3";
package com.antigravity;

import "client/model.proto";
import "client/audio_config.proto";

option java_package = "com.antigravity.proto";
option java_multiple_files = true;
option java_outer_classname = "DriverModelProto";

message DriverModel {
  Model model = 1;
  string name = 2;
  string nickname = 3;
  string avatarUrl = 4;
  AudioConfig lapAudio = 5;
  AudioConfig bestLapAudio = 6;
  AudioConfig penaltyAudio = 7;
  AudioConfig overallBestLapAudio = 8;
  AudioConfig overallLaneBestLapAudio = 9;
  AudioConfig raceBestLapAudio = 10;
  AudioConfig raceLaneBestLapAudio = 11;
  AudioConfig heatBestLapAudio = 12;
  AudioConfig newRaceLeaderAudio = 13;
  AudioConfig newHeatLeaderAudio = 14;
}
