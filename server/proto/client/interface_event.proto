syntax = "proto3";
package com.antigravity;

option java_package = "com.antigravity.proto";
option java_multiple_files = true;
option java_outer_classname = "InterfaceEventProto";

enum InterfaceStatus {
  CONNECTED = 0;
  DISCONNECTED = 1;
  NO_DATA = 2;
}

enum AlertSeverity {
  ALERT_SEVERITY_INFO = 0;
  ALERT_SEVERITY_WARNING = 1;
  ALERT_SEVERITY_ERROR = 2;
}

enum AlertType {
  ALERT_TYPE_GENERIC = 0;
  ALERT_TYPE_BROWNOUT_RESET = 1;
  ALERT_TYPE_COMMUNICATION_ERROR = 2;
  ALERT_TYPE_SENSOR_MALFUNCTION = 3;
}

message InterfaceAlertEvent {
  int32 interface_index = 1;
  string interface_name = 2;
  AlertType alert_type = 3;
  AlertSeverity severity = 4;
  string title_key = 5;
  string message_key = 6;
  string details = 7;
  int32 occurrence_count = 8;
  int64 timestamp_ms = 9;
}

message InterfaceEvent {
  oneof event {
    LapEvent lap = 1;
    SegmentEvent segment = 2;
    InterfaceStatusEvent status = 3;
    CallbuttonEvent callbutton = 4;
    InterfaceAnalogDataEvent analogData = 5;
    InterfaceDigitalPinEvent digitalPin = 6;
    InterfaceAlertEvent alert = 7;
  }
}

message InterfaceDigitalPinEvent {
  int32 pin = 1;
  int32 state = 2; // 0 or 1
  bool is_digital = 3;
  int32 interface_index = 4;
}

message InterfaceStatusEvent {
  InterfaceStatus status = 1;
  int32 interface_index = 2;
  int32 detected_channels = 3;
  bool supports_rgb_leds = 4;
  string version = 5;
}

message LapEvent {
  int32 lane = 1;
  double lap_time = 2;
  int32 interface_id = 3;
  int32 interface_index = 4;
}

message SegmentEvent {
  int32 lane = 1;
  double segment_time = 2;
  int32 interface_id = 3;
  int32 interface_index = 4;
}

message CallbuttonEvent {
  int32 lane = 1;
  int32 interface_index = 2;
}

message InterfaceAnalogDataEvent {
  int32 pin = 1;
  int32 value = 2;
  int32 interface_index = 3;
}