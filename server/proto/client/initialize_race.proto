syntax = "proto3";
package com.antigravity;

// No imports needed

option java_package = "com.antigravity.proto";
option java_multiple_files = true;
option java_outer_classname = "InitializeRaceProto";

import "client/demo_config.proto";

message InitializeRaceRequest {
  string race_id = 1;
  repeated string driver_ids = 2;
  bool is_demo_mode = 3;
  DemoConfig demo_config = 4;
  string event_id = 5;
  string season_id = 6;
  string theme_id = 7;
  // File → Race Again: only allowed while the current race is over.
  // https://github.com/daufderheide/racecoordinator_ai/issues/679
  bool race_again = 8;
}

message InitializeRaceResponse {
  bool success = 1;
  string error_code = 2;
  string driver_name = 3;
  repeated string team_names = 4;
}
