syntax = "proto3";
package com.antigravity;

import "client/driver_model.proto";
import "client/team_model.proto";

option java_package = "com.antigravity.proto";
option java_multiple_files = true;
option java_outer_classname = "RaceParticipantProto";

message RaceParticipant {
  string object_id = 1;
  DriverModel driver = 2;
  int32 rank = 3;
  double total_laps = 4;
  double total_time = 5;
  double best_lap_time = 6;
  double average_lap_time = 7;
  double median_lap_time = 8;
  double rank_value = 9;
  int32 seed = 10;
  TeamModel team = 11;
  double fuel_level = 12;
  double gap_leader = 13;
  double gap_position = 14;
  double gap_leader_f1 = 15;
  double gap_position_f1 = 16;
  int32 laps_down_leader = 17;
  int32 laps_down_position = 18;
  double consistency_score = 19;
  int32 physical_lap_count = 20;
  double standard_deviation = 21;
  int32 laps_led = 22;
  int32 track_calls = 23;
  double total_points = 24;
  double average_top5 = 25;
  double average_top10 = 26;
  double average_top15 = 27;
  double top2_consecutive = 28;
  double top3_consecutive = 29;
  bool has_segments = 30;
}
