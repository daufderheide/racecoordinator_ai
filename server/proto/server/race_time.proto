syntax = "proto3";
package com.antigravity;

option java_package = "com.antigravity.proto";
option java_multiple_files = true;
option java_outer_classname = "RaceTimeProto";

message RaceTime {
  double time = 1;
  double auto_start_remaining = 2;
  double auto_advance_remaining = 3;
  HotYellowRestartCountdown hot_yellow_restart = 4;
}

message HotYellowRestartCountdown {
  double duration = 1;
  double remaining = 2;
}
