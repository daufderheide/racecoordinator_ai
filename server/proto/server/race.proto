syntax = "proto3";
package com.antigravity;

import "client/race_model.proto";
import "server/heat.proto";
import "server/race_participant.proto";
import "server/race_state.proto";
import "server/record_data.proto";
import "server/season_standing.proto";

option java_package = "com.antigravity.proto";
option java_multiple_files = true;
option java_outer_classname = "RaceProto";

message Race {
  RaceModel race = 1;
  repeated RaceParticipant drivers = 2;
  repeated Heat heats = 3;
  Heat current_heat = 4;
  RaceState state = 5;
  RaceFlag flag = 6;
  RecordData record_data = 7;
  bool is_event = 8;
  string event_id = 9;
  string event_name = 10;
  int32 current_event_race_index = 11;
  int32 total_event_races = 12;
  double auto_advance_remaining_seconds = 13;
  bool is_season = 14;
  string season_id = 15;
  string season_name = 16;
  repeated SeasonStanding season_standings = 17;
  int64 start_time_millis = 18;
}
