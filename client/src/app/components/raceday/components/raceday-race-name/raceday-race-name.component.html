@if (race()) {
  <div
    class="info-section"
    #infoPanel
    [style.--header-label-font-size]="
      widget()?.customSettings?.['labelFontSize']
        ? widget()?.customSettings?.['labelFontSize'] + 'px'
        : null
    "
    [style.--header-value-font-size]="
      widget()?.customSettings?.['valueFontSize']
        ? widget()?.customSettings?.['valueFontSize'] + 'px'
        : null
    "
  >
    <span
      class="label-text"
      #labelText
      [style.font-family]="
        widget()?.customSettings?.['labelFontFamily'] || null
      "
      [style.font-size.px]="
        widget()?.customSettings?.['labelFontSize'] ||
        (widget()?.scaleMode !== 'auto' ? 13 : null)
      "
      [style.color]="widget()?.customSettings?.['labelTextColor'] || null"
      >{{ "RD_LABEL_RACE" | translate }}</span
    >
    <span
      class="value-text"
      #valueText
      [style.font-family]="
        widget()?.customSettings?.['valueFontFamily'] || null
      "
      [style.font-size.px]="
        widget()?.customSettings?.['valueFontSize'] ||
        (widget()?.scaleMode !== 'auto' ? 18 : null)
      "
      [style.color]="widget()?.customSettings?.['valueTextColor'] || null"
      >{{ formattedRaceName }}</span
    >
  </div>
}
