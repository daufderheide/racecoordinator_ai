<div
  class="raceday-label-widget"
  [class.vertical-label]="isVertical()"
  [style.font-family]="widget()?.customSettings?.['fontFamily'] || null"
  [style.font-size.px]="widget()?.customSettings?.['fontSize'] || 18"
  [style.color]="widget()?.customSettings?.['textColor'] || '#ffffff'"
  [style.background-color]="
    widget()?.customSettings?.['backgroundColor'] || 'rgba(15, 23, 42, 0.85)'
  "
  [style.font-weight]="
    widget()?.customSettings?.['fontBold'] ? 'bold' : 'normal'
  "
  [style.font-style]="
    widget()?.customSettings?.['fontItalic'] ? 'italic' : 'normal'
  "
  [style.justify-content]="getJustify(widget()?.customSettings?.['alignment'])"
  [style.border-color]="
    widget()?.customSettings?.['borderColor'] ||
    widget()?.customSettings?.['textColor'] ||
    '#ffffff'
  "
  [style.border-width.px]="
    widget()?.customSettings?.['borderWidth'] != null
      ? widget()?.customSettings?.['borderWidth']
      : 1
  "
  [style.border-radius.px]="
    widget()?.customSettings?.['borderRadius'] != null
      ? widget()?.customSettings?.['borderRadius']
      : 4
  "
  [style.border-style]="
    widget()?.customSettings?.['showBorder'] ? 'solid' : 'none'
  "
>
  <span class="label-widget-text">{{
    widget()?.customSettings?.["text"] || ""
  }}</span>
</div>
