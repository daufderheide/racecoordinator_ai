@if (settings()) {
  <div class="inspector-geometry-title">
    {{ "UE_INSPECTOR_IMAGE_SELECT" | translate }}
  </div>

  <div class="inspector-section" style="display: flex; justify-content: center">
    <app-image-selector
      [imageUrl]="settings().imageUrl"
      (imageUrlChange)="onImageUrlChange($event)"
      [assets]="imageAssets"
      [size]="'large'"
    >
    </app-image-selector>
  </div>

  <app-widget-border-inspector
    [settings]="settings()"
    [defaultBorderRadius]="8"
    [defaultBorderWidth]="1"
    defaultBorderColor="#ffffff"
    [defaultShowBorder]="true"
    (change)="change.emit()"
  ></app-widget-border-inspector>
}
