<div
  class="driver-station-container"
  [class.fuel-race]="isFuelRace"
  [style.background-color]="backgroundColor"
  [style.color]="foregroundColor"
>
  <app-browser-navigation
    class="driver-station-nav"
    mode="navigation"
  ></app-browser-navigation>
  <!-- Column 1: Thermometer (Time/Laps Left) -->
  <div class="column thermometer-column">
    <app-raceday-progress-gauge
      class="ds-gauge-fill"
      [parent]="this"
      [widget]="progressWidget"
    ></app-raceday-progress-gauge>
  </div>

  <!-- Column 2: Data Rows -->
  <div class="column data-column" [class.span-all]="!isFuelRace">
    <div class="data-row driver-row">
      <app-raceday-lane-column
        class="driver-col flex-1"
        [parent]="this"
        [widget]="nicknameWidget"
      ></app-raceday-lane-column>
      <app-raceday-lane-column
        class="driver-col lane-col-fix"
        [parent]="this"
        [widget]="laneNumberWidget"
      ></app-raceday-lane-column>
    </div>
    <div class="data-row rank-row">
      <app-raceday-lane-column
        class="rank-col"
        [parent]="this"
        [widget]="heatRankWidget"
      ></app-raceday-lane-column>
      <app-raceday-lane-column
        class="rank-col"
        [parent]="this"
        [widget]="overallRankWidget"
      ></app-raceday-lane-column>
    </div>
    <div class="data-row lap-row">
      <app-raceday-lane-column
        class="lap-col lap-count-col"
        [parent]="this"
        [widget]="lapCountWidget"
      ></app-raceday-lane-column>
      <app-raceday-lane-column
        class="lap-col lap-time-col"
        [parent]="this"
        [widget]="lastLapTimeWidget"
      ></app-raceday-lane-column>
    </div>
    <div class="data-row single-col-row">
      <app-raceday-lane-column
        class="single-col"
        [parent]="this"
        [widget]="gapLeaderWidget"
      ></app-raceday-lane-column>
    </div>
    <div class="data-row single-col-row">
      <app-raceday-lane-column
        class="single-col"
        [parent]="this"
        [widget]="bestLapTimeWidget"
      ></app-raceday-lane-column>
    </div>
    <div class="data-row race-state-row">
      <app-raceday-flag
        class="flag-col"
        [parent]="this"
        [widget]="flagWidget"
      ></app-raceday-flag>
    </div>
  </div>

  <!-- Column 3: Fuel Thermometer (Conditional) -->
  @if (isFuelRace) {
    <div class="column thermometer-column fuel-column">
      <app-raceday-progress-gauge
        class="ds-gauge-fill"
        [parent]="this"
        [widget]="fuelProgressWidget"
      ></app-raceday-progress-gauge>
    </div>
  }
</div>

<app-acknowledgement-modal
  [visible]="showAckModal"
  [title]="ackModalTitle"
  [message]="ackModalMessage"
  [buttonText]="ackModalButtonText"
  (acknowledge)="onAcknowledgeModal()"
>
</app-acknowledgement-modal>
